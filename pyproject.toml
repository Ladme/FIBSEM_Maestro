[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fibsem-maestro"
description = "Software for (cryo) volume-EM acquisition."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "matplotlib>=3.11.2",
    "numpy==2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "tifffile==2026.10.15",
    "pyqt6>=6.12.0",
    "qdarkstyle>=3.2.3",
]

dynamic = ["version"]

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.setuptools_scm]
write_to = "src/fibsem_maestro/_version.py"

[tool.ruff]
exclude = ["src/fibsem_maestro_original", "src/criterion_playground.py"]

[tool.ruff.lint]
extend-select = [
    "F",   # Pyflakes rules
    "W",   # PyCodeStyle warnings
    "E",   # PyCodeStyle errors
    "I",   # Sort imports properly
    "UP",  # Warn if certain things can changed due to newer Python versions
    "C4",  # Catch incorrect use of comprehensions, dict, list, etc
    "FA",  # Enforce from __future__ import annotations
    "ISC", # Good use of string concatenation
    "ICN", # Use common import conventions
    "RET", # Good return practices
    "SIM", # Common simplification rules
    "TID", # Some good import practices
    "TC",  # Enforce importing certain types in a TYPE_CHECKING block
    "PTH", # Use pathlib instead of os.path
    "NPY", # Some numpy-specific things
    "ARG", # Catch incorrect use of arguments
]
ignore = ["E501", "BLE001", "S112", "B017"]

[tool.ruff.lint.per-file-ignores]
"tests/microscope/test_autoscript_boundary.py" = ["E402"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates model annotations at runtime, so their imports must stay real
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "fibsem_maestro.settings.reactive.ReactiveModel",
    "fibsem_maestro.settings.base_settings.BaseSettings",
    "fibsem_maestro.action.state.ActionState",
    "fibsem_maestro.settings.template_matching_settings.TemplateMatchingSettings",
]

[tool.ty.src]
exclude = ["src/fibsem_maestro_original", "src/criterion_playground.py"]

[tool.ty.analysis]
allowed-unresolved-imports = ["autoscript_sdb_microscope_client.**"]

[tool.uv]
package = true

[project.gui-scripts]
fibsem-maestro = "fibsem_maestro.main:main"

[project.scripts]
fibsem-maestro-dev = "fibsem_maestro.main:main"
