[project]
name = "fibsem-maestro"
version = "0.1.0"
description = "Software for (cryo) volume-EM acquisition."
readme = "README.md"
requires-python = "==3.11.13"
dependencies = [
    "colorama>=0.4.6",
    "keyring>=25.7.0",
    "matplotlib>=3.8.1",
    "nicegui>=3.7.1",
    "numpy==2.2.5",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.0.0",
    "pydantic==2.12.4",
    "pyqt5>=5.15.11",
    "pyyaml==6.0.3",
    "scipy==1.15.3",
    "tifffile==2025.3.13",
]

[dependency-groups]
dev = ["pyright>=1.1.407", "pytest>=9.0.1", "ruff>=0.14.6"]

[tool.ruff]
exclude = ["src/fibsem_maestro_original", "src/criterion_playground.py"]

[tool.ruff.lint]
extend-select = [
    "F",   # Pyflakes rules
    "W",   # PyCodeStyle warnings
    "E",   # PyCodeStyle errors
    "I",   # Sort imports properly
    "UP",  # Warn if certain things can changed due to newer Python versions
    "C4",  # Catch incorrect use of comprehensions, dict, list, etc
    "FA",  # Enforce from __future__ import annotations
    "ISC", # Good use of string concatenation
    "ICN", # Use common import conventions
    "RET", # Good return practices
    "SIM", # Common simplification rules
    "TID", # Some good import practices
    "TC",  # Enforce importing certain types in a TYPE_CHECKING block
    "PTH", # Use pathlib instead of os.path
    "NPY", # Some numpy-specific things
    "ARG", # Catch incorrect use of arguments
]
ignore = ["E501"]

[tool.pyright]

pythonVersion = "3.11"

include = ["src/fibsem_maestro"]

executionEnvironments = [{ root = "src", pythonVersion = "3.11" }]

# Strictness toggles
reportMissingTypeStubs = true
reportMissingImports = true
reportMissingModuleSource = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUninitializedInstanceVariable = false

# Usage strictness
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnusedFunction = "warning"
reportUnusedClass = "warning"

# Safety & correctness
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportInconsistentConstructor = "error"
reportOverlappingOverload = "error"
reportInvalidTypeVarUse = "error"
reportInvalidTypeForm = "error"

# Optional / None strictness
reportOptionalMemberAccess = "error"
reportOptionalOperand = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalSubscript = "error"

# Narrowing strictness
reportUnreachable = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryComparison = "warning"

# Coroutine / async strictness
reportUnusedCoroutine = "error"

# API correctness warnings
reportPrivateImportUsage = "error"
reportUnsupportedDunderAll = "warning"

# Enforce explicit function signatures
reportUntypedFunctionDecorator = "error"
