name: Build wheel

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build the wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.event.release.tag_name }}
        run: uv build --wheel

      - name: Verify the wheel carries the release version
        run: |
          expected="${{ github.event.release.tag_name }}"
          expected="${expected#v}"
          ls dist/
          ls dist/*.whl | grep -q "fibsem_maestro-${expected//-/_}-" || {
            echo "::error::Wheel version does not match tag $expected"
            exit 1
          }

      - name: Attach the wheel to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
