  <title
     id="title1">Symmetric dual-beam FIB-SEM icon</title>
  <desc
     id="desc1">A graphite app icon showing two tapered beam wedges separated by 52 degrees converging on a point at the centre of a horizontal specimen bar, shown large and at 64, 48, 32 and 16 pixel previews.</desc>
